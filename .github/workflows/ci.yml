name: ci

# Automatic push/PR triggers are disabled; local CI now runs via
# scripts/run-ci.sh. Trigger this workflow manually from the Actions tab
# (or `gh workflow run ci.yml`) if needed.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Documentation checks
        run: bash scripts/check-docs.sh

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload embedded dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: rust checks
    runs-on: ubuntu-latest
    needs: [format, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The dashboard bundle is embedded into the binary via rust-embed.
      # Reuse the dashboard job's artifact instead of rebuilding it here.
      - name: Download embedded dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test --quiet

      - name: Build compatibility binary
        run: cargo build --quiet --bin kinetix

      - name: Pi + Claude Code compatibility matrix
        env:
          KINETIX_BIN: target/debug/kinetix
          SYN_TOKENS: "4"
          SYN_DELAY_MS: "0"
        run: bash scripts/compat-matrix.sh

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
