[package]
name = "kinetix"
version = "0.6.0"
edition = "2021"
description = "Multi-protocol LLM proxy: OpenAI/Anthropic in, configurable upstreams out, with virtual keys, account pools, Routes, and cost tracking"
license = "MIT"
repository = "https://github.com/PrightCord/kinetix"
authors = ["PrightCord"]
homepage = "https://github.com/PrightCord/kinetix"
default-run = "kinetix"

[[bin]]
name = "kinetix"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
hyper = { version = "1", features = ["full"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "blocking"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "macros"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
thiserror = "2"
url = "2"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
subtle = "2"

rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }
mime_guess = "2"

dashmap = "6"
parking_lot = "0.12"
once_cell = "1"

jsonwebtoken = "10"
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
libc = "0.2"
wasmtime = { version = "48.0.3", features = ["component-model", "async", "cranelift", "pooling-allocator", "runtime"] }
tar = "0.4.46"
ed25519-dalek = "3.0.0"
semver = "1.0"
pbkdf2 = "0.12.2"
serde_jcs = "0.2.0"

[dev-dependencies]
wat = "1"

[features]
# NFR-1.8: opt-in allocation accounting for the benchmark harness.
default = []
alloc-stats = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
